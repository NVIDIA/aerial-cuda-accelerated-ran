services:
  e3agent-standalone:
    build:
      context: .
    image: e3agent-standalone:latest
    container_name: e3agent-standalone
    # Holds the POSIX SHM the agent maps (~0.73 GB at default rows).
    shm_size: "1gb"
    # dApp containers attach to this SHM with: ipc: "container:e3agent-standalone".
    ipc: shareable
    network_mode: host
    volumes:
      - ./config:/opt/e3agent-standalone/config:ro
      - ./logs:/logs
      - ./data:/data:ro   # replay traces (e.g., clickhouse_to_trace.py output); used in replay mode
    command: ["./build/e3agent_standalone", "--config", "${E3SA_CONFIG:-config/e3agent-standalone.example.yaml}"]
    restart: "no"
